# 워크플로우 이름
name: Deploy Full Stack

# 트리거 조건: main, develop 브랜치에 push할 때 실행
on:
  push:
    branches: ["main", "develop"]

jobs:
  # ===================================================================
  #  Job 1: 백엔드 Docker 이미지 빌드 및 푸시
  # ===================================================================
  build-backend:
    # Ubuntu 최신 버전에서 실행
    runs-on: ubuntu-latest
    # 실행 조건: main/develop 브랜치이고, back/ 폴더 또는 docker-compose.yml이 변경된 경우
    if: |
      (contains(github.ref, 'main') || contains(github.ref, 'develop')) &&
      (contains(github.event.head_commit.modified, 'back/') || 
       contains(github.event.head_commit.added, 'back/') ||
       contains(github.event.head_commit.removed, 'back/') ||
       contains(github.event.head_commit.modified, 'docker-compose.yml') ||
       contains(github.event.head_commit.added, 'docker-compose.yml') ||
       contains(github.event.head_commit.removed, 'docker-compose.yml'))
    steps:
      # 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: jonathanchoii
          password: ${{ secrets.DOCKERHUB_TOKEN_6 }}

      # Docker Buildx 설정 (멀티 플랫폼 빌드 지원)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 백엔드 Docker 이미지 빌드 및 Docker Hub에 푸시
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./back  # 빌드 컨텍스트 디렉토리
          file: ./back/Dockerfile  # Dockerfile 경로
          push: true  # Docker Hub에 푸시
          tags: |  # 이미지 태그 설정
            jonathanchoii/pls-jober-backend:latest  # 최신 버전
            jonathanchoii/pls-jober-backend:${{ github.ref_name }}  # 브랜치명 태그
            jonathanchoii/pls-jober-backend:${{ github.sha }}  # Git SHA 태그

  # ===================================================================
  #  Job 2: AI 서비스 Docker 이미지 빌드 및 푸시
  # ===================================================================
  build-ai:
    # Ubuntu 최신 버전에서 실행
    runs-on: ubuntu-latest
    # 실행 조건: main/develop 브랜치이고, ai/ 폴더 또는 docker-compose.yml이 변경된 경우
    if: |
      (contains(github.ref, 'main') || contains(github.ref, 'develop')) &&
      (contains(github.event.head_commit.modified, 'ai/') || 
       contains(github.event.head_commit.added, 'ai/') ||
       contains(github.event.head_commit.removed, 'ai/') ||
       contains(github.event.head_commit.modified, 'docker-compose.yml') ||
       contains(github.event.head_commit.added, 'docker-compose.yml') ||
       contains(github.event.head_commit.removed, 'docker-compose.yml'))
    steps:
      # 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: jonathanchoii
          password: ${{ secrets.DOCKERHUB_TOKEN_6 }}

      # Docker Buildx 설정 (멀티 플랫폼 빌드 지원)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # AI 서비스 Docker 이미지 빌드 및 Docker Hub에 푸시
      - name: Build and push AI service image
        uses: docker/build-push-action@v5
        with:
          context: ./ai  # 빌드 컨텍스트 디렉토리
          file: ./ai/Dockerfile  # Dockerfile 경로
          push: true  # Docker Hub에 푸시
          tags: |  # 이미지 태그 설정
            jonathanchoii/pls-jober-ai:latest  # 최신 버전
            jonathanchoii/pls-jober-ai:${{ github.ref_name }}  # 브랜치명 태그
            jonathanchoii/pls-jober-ai:${{ github.sha }}  # Git SHA 태그

  # ===================================================================
  #  Job 3: 프론트엔드 빌드
  # ===================================================================
  build-frontend:
    # Ubuntu 최신 버전에서 실행
    runs-on: ubuntu-latest
    # 실행 조건: main/develop 브랜치이고, front/ 폴더 또는 docker-compose.yml이 변경된 경우
    if: |
      (contains(github.ref, 'main') || contains(github.ref, 'develop')) &&
      (contains(github.event.head_commit.modified, 'front/') || 
       contains(github.event.head_commit.added, 'front/') ||
       contains(github.event.head_commit.removed, 'front/') ||
       contains(github.event.head_commit.modified, 'docker-compose.yml') ||
       contains(github.event.head_commit.added, 'docker-compose.yml') ||
       contains(github.event.head_commit.removed, 'docker-compose.yml'))
    steps:
      # 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4
        
      # Node.js 22 버전 설정 및 npm 캐시 설정
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # Node.js 버전
          cache: 'npm'  # npm 캐시 활성화
          cache-dependency-path: front/package-lock.json  # 캐시 경로
          
      # 의존성 설치 (package-lock.json 기반)
      - name: Install dependencies
        working-directory: ./front
        run: npm ci
        
      # TypeScript 타입 체크 실행
      - name: Run type check
        working-directory: ./front
        run: npm run type-check
        
      # ESLint 린터 실행 (에러가 있어도 배포 계속)
      - name: Run linter
        working-directory: ./front
        run: npm run lint || echo "ESLint warnings/errors found but continuing deployment"
        
      # 프론트엔드 애플리케이션 빌드
      - name: Build application
        working-directory: ./front
        run: npm run build

      # 빌드된 파일을 아티팩트로 업로드 (다음 job에서 사용)
      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist  # 아티팩트 이름
          path: front/dist/  # 업로드할 경로
          retention-days: 1  # 보관 기간 (1일)

  # ===================================================================
  #  Job 3: 백엔드 배포
  # ===================================================================
  deploy-backend:
    # build-backend job이 성공한 후에만 실행
    needs: build-backend
    # Ubuntu 최신 버전에서 실행
    runs-on: ubuntu-latest
    # 백엔드 빌드가 성공한 경우에만 실행
    if: needs.build-backend.result == 'success'
    # 환경 설정: main 브랜치는 production, develop 브랜치는 staging
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      # Oracle Cloud VM에 SSH로 접속하여 백엔드 배포
      - name: Deploy backend to Oracle Cloud VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 134.185.106.160  # 서버 IP 주소
          username: ubuntu  # SSH 사용자명
          key: ${{ secrets.SSH_PRIVATE }}  # SSH 개인키 (GitHub Secrets)
          script: |
            # Docker Hub에서 최신 이미지를 pull
            docker pull jonathanchoii/pls-jober-backend:latest
            
            # 기존 컨테이너 백업 (롤백용)
            if docker ps -q -f name=pls-jober-container > /dev/null; then
              echo "기존 컨테이너를 백업합니다..."
              docker commit pls-jober-container pls-jober-backup:$(date +%Y%m%d_%H%M%S) || true
            fi
            
            # 기존 컨테이너 중지 (백업 후)
            docker stop pls-jober-container || true
            docker rm pls-jober-container || true
            
            # 새 컨테이너 실행 (서버에 미리 생성해둔 .env 파일 사용)
            if docker run -d -p 8080:8080 --env-file /home/ubuntu/.env --name pls-jober-container --restart unless-stopped jonathanchoii/pls-jober-backend:latest; then
              # 헬스체크 수행
              echo "헬스체크를 수행합니다..."
              for i in {1..30}; do
                if curl -f http://localhost:8080/actuator/health > /dev/null 2>&1; then
                  echo "✅ 백엔드 배포 및 헬스체크 성공"
                  break
                fi
                echo "헬스체크 시도 $i/30..."
                sleep 10
                if [ $i -eq 30 ]; then
                  echo "❌ 헬스체크 실패 - 롤백을 시도합니다"
                  # 롤백: 백업된 이미지로 복원
                  if docker images --format "table {{.Repository}}:{{.Tag}}" | grep -q pls-jober-backup; then
                    LATEST_BACKUP=$(docker images --format "table {{.Repository}}:{{.Tag}}" | grep pls-jober-backup | head -1 | awk '{print $1}')
                    docker stop pls-jober-container || true
                    docker rm pls-jober-container || true
                    docker run -d -p 8080:8080 --env-file /home/ubuntu/.env --name pls-jober-container --restart unless-stopped $LATEST_BACKUP
                    echo "🔄 백업된 버전으로 롤백 완료"
                  else
                    echo "❌ 롤백 실패 - 백업 이미지가 없습니다"
                    exit 1
                  fi
                fi
              done
            else
              echo "❌ 새 컨테이너 실행 실패"
              exit 1
            fi
            
            # 사용하지 않는 Docker 이미지 정리 (디스크 공간 확보)
            docker image prune -f
            echo "Backend deployment complete."

  # ===================================================================
  #  Job 4: AI 서비스 배포
  # ===================================================================
  deploy-ai:
    # build-ai job이 성공한 후에만 실행
    needs: build-ai
    # Ubuntu 최신 버전에서 실행
    runs-on: ubuntu-latest
    # AI 서비스 빌드가 성공한 경우에만 실행
    if: needs.build-ai.result == 'success'
    # 환경 설정: main 브랜치는 production, develop 브랜치는 staging
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      # Oracle Cloud VM에 SSH로 접속하여 AI 서비스 배포
      - name: Deploy AI service to Oracle Cloud VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 134.185.106.160  # 서버 IP 주소
          username: ubuntu  # SSH 사용자명
          key: ${{ secrets.SSH_PRIVATE }}  # SSH 개인키 (GitHub Secrets)
          script: |
            # Docker Hub에서 최신 AI 서비스 이미지를 pull
            docker pull jonathanchoii/pls-jober-ai:latest
            
            # 기존 AI 서비스 컨테이너 백업 (롤백용)
            if docker ps -q -f name=pls-jober-ai-container > /dev/null; then
              echo "기존 AI 서비스 컨테이너를 백업합니다..."
              docker commit pls-jober-ai-container pls-jober-ai-backup:$(date +%Y%m%d_%H%M%S) || true
            fi
            
            # 기존 AI 서비스 컨테이너 중지 (백업 후)
            docker stop pls-jober-ai-container || true
            docker rm pls-jober-ai-container || true
            
            # 새 AI 서비스 컨테이너 실행 (서버에 미리 생성해둔 .env 파일 사용)
            if docker run -d -p 8000:8000 --env-file /home/ubuntu/.env --name pls-jober-ai-container --restart unless-stopped jonathanchoii/pls-jober-ai:latest; then
              # 헬스체크 수행
              echo "AI 서비스 헬스체크를 수행합니다..."
              for i in {1..30}; do
                if curl -f http://localhost:8000/health > /dev/null 2>&1; then
                  echo "✅ AI 서비스 배포 및 헬스체크 성공"
                  break
                fi
                echo "AI 서비스 헬스체크 시도 $i/30..."
                sleep 10
                if [ $i -eq 30 ]; then
                  echo "❌ AI 서비스 헬스체크 실패 - 롤백을 시도합니다"
                  # 롤백: 백업된 이미지로 복원
                  if docker images --format "table {{.Repository}}:{{.Tag}}" | grep -q pls-jober-ai-backup; then
                    LATEST_BACKUP=$(docker images --format "table {{.Repository}}:{{.Tag}}" | grep pls-jober-ai-backup | head -1 | awk '{print $1}')
                    docker stop pls-jober-ai-container || true
                    docker rm pls-jober-ai-container || true
                    docker run -d -p 8000:8000 --env-file /home/ubuntu/.env --name pls-jober-ai-container --restart unless-stopped $LATEST_BACKUP
                    echo "🔄 AI 서비스 백업된 버전으로 롤백 완료"
                  else
                    echo "❌ AI 서비스 롤백 실패 - 백업 이미지가 없습니다"
                    exit 1
                  fi
                fi
              done
            else
              echo "❌ 새 AI 서비스 컨테이너 실행 실패"
              exit 1
            fi
            
            # 사용하지 않는 Docker 이미지 정리 (디스크 공간 확보)
            docker image prune -f
            echo "AI service deployment complete."

  # ===================================================================
  #  Job 5: 프론트엔드 배포
  # ===================================================================
  deploy-frontend:
    # build-frontend job이 성공한 후에만 실행
    needs: build-frontend
    # Ubuntu 최신 버전에서 실행
    runs-on: ubuntu-latest
    # 프론트엔드 빌드가 성공한 경우에만 실행
    if: needs.build-frontend.result == 'success'
    # 환경 설정: main 브랜치는 production, develop 브랜치는 staging
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      # 이전 job에서 업로드한 빌드 아티팩트 다운로드
      - name: Download frontend build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist  # 아티팩트 이름
          path: front/dist/  # 다운로드 경로

      # Oracle Cloud 서버에 SSH로 접속하여 배포 디렉토리 준비
      - name: Deploy frontend to Oracle Cloud Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 134.185.106.160  # 서버 IP 주소
          username: ubuntu  # SSH 사용자명
          key: ${{ secrets.SSH_PRIVATE }}  # SSH 개인키 (GitHub Secrets)
          port: 22  # SSH 포트
          script: |
            # 배포 디렉토리 생성
            sudo mkdir -p /var/www/frontend
            sudo chown -R $USER:$USER /var/www/frontend
            
            # 기존 파일 백업
            if [ -d "/var/www/frontend/backup" ]; then
              sudo rm -rf /var/www/frontend/backup
            fi
            if [ -d "/var/www/frontend/dist" ]; then
              sudo mv /var/www/frontend/dist /var/www/frontend/backup
            fi
            
            # 새로운 배포 디렉토리 생성
            mkdir -p /var/www/frontend/dist

      # 빌드된 파일들을 서버로 복사
      - name: Copy build files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 134.185.106.160  # 서버 IP 주소
          username: ubuntu  # SSH 사용자명
          key: ${{ secrets.SSH_PRIVATE }}  # SSH 개인키 (GitHub Secrets)
          port: 22  # SSH 포트
          source: "front/dist/**"  # 복사할 소스 경로
          target: "/var/www/frontend/dist/"  # 서버 대상 경로

      # Nginx 설정 및 웹서버 구성
      - name: Setup Nginx (if not already configured)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 134.185.106.160  # 서버 IP 주소
          username: ubuntu  # SSH 사용자명
          key: ${{ secrets.SSH_PRIVATE }}  # SSH 개인키 (GitHub Secrets)
          port: 22  # SSH 포트
          script: |
            # Nginx 설치 (이미 설치되어 있으면 스킵)
            if ! command -v nginx &> /dev/null; then
              sudo apt update
              sudo apt install -y nginx
            fi
            
            # Certbot 설치 (Let's Encrypt SSL 인증서용)
            if ! command -v certbot &> /dev/null; then
              sudo apt install -y certbot python3-certbot-nginx
            fi
            
            # Nginx 설정 파일 생성 (HTTP + HTTPS)
            sudo tee /etc/nginx/sites-available/frontend > /dev/null <<'EOF'
            # HTTP에서 HTTPS로 리다이렉트
            server {
                listen 80;
                server_name 134.185.106.160;
                return 301 https://$server_name$request_uri;
            }
            
            # HTTPS 서버 설정
            server {
                listen 443 ssl http2;
                server_name 134.185.106.160;
                
                # SSL 인증서 경로 (Let's Encrypt)
                ssl_certificate /etc/letsencrypt/live/134.185.106.160/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/134.185.106.160/privkey.pem;
                
                # SSL 보안 설정
                ssl_protocols TLSv1.2 TLSv1.3;
                ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
                ssl_prefer_server_ciphers off;
                ssl_session_cache shared:SSL:10m;
                ssl_session_timeout 10m;
                
                # HSTS 헤더 추가
                add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
                
                root /var/www/frontend/dist;
                index index.html;
                
                # SPA 라우팅을 위한 설정
                location / {
                    try_files $uri $uri/ /index.html;
                }
                
                # 정적 파일 캐싱 (성능 최적화)
                location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
                    expires 1y;
                    add_header Cache-Control "public, immutable";
                }
                
                # 보안 헤더 추가
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header X-XSS-Protection "1; mode=block" always;
            }
            EOF
            
            # 사이트 활성화 (심볼릭 링크 생성)
            sudo ln -sf /etc/nginx/sites-available/frontend /etc/nginx/sites-enabled/
            
            # 기본 사이트 비활성화
            sudo rm -f /etc/nginx/sites-enabled/default
            
            # Nginx 설정 테스트
            sudo nginx -t
            
            # 파일 권한 설정
            sudo chown -R www-data:www-data /var/www/frontend/
            sudo chmod -R 755 /var/www/frontend/
            
            # SSL 인증서 발급 (Let's Encrypt)
            echo "SSL 인증서를 발급합니다..."
            sudo certbot --nginx -d 134.185.106.160 --non-interactive --agree-tos --email admin@134.185.106.160 --redirect || echo "SSL 인증서 발급 실패 (HTTP로 계속 진행)"
            
            # Nginx 재시작
            sudo systemctl restart nginx

  # ===================================================================
  #  Job 6: 배포 완료 알림
  # ===================================================================
  deployment-status:
    # 모든 배포 관련 job들이 완료된 후 실행
    needs: [build-backend, build-ai, build-frontend, deploy-backend, deploy-ai, deploy-frontend]
    # Ubuntu 최신 버전에서 실행
    runs-on: ubuntu-latest
    # 항상 실행하되, 백엔드, AI, 프론트엔드 빌드 중 하나라도 스킵되지 않은 경우에만
    if: always() && (needs.build-backend.result != 'skipped' || needs.build-ai.result != 'skipped' || needs.build-frontend.result != 'skipped')
    steps:
      # 배포 상태 요약 및 결과 출력
      - name: Deployment Status
        run: |
          echo "📊 Deployment Summary:"
          echo "Backend build: ${{ needs.build-backend.result }}"  # 백엔드 빌드 결과
          echo "AI service build: ${{ needs.build-ai.result }}"  # AI 서비스 빌드 결과
          echo "Frontend build: ${{ needs.build-frontend.result }}"  # 프론트엔드 빌드 결과
          echo "Backend deploy: ${{ needs.deploy-backend.result }}"  # 백엔드 배포 결과
          echo "AI service deploy: ${{ needs.deploy-ai.result }}"  # AI 서비스 배포 결과
          echo "Frontend deploy: ${{ needs.deploy-frontend.result }}"  # 프론트엔드 배포 결과
