spring:
  application:
    name: final-project-backend-test
  
  # 테스트용 데이터베이스 설정 (H2)
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # H2 콘솔 활성화
  h2:
    console:
      enabled: true

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # Redis 설정 (테스트용 임베디드)
  data:
    redis:
      host: localhost
      port: 6370  # 테스트용 다른 포트
      database: 1

# JWT 설정
jwt:
  secret: test-secret-key-for-jwt-tokens-minimum-256-bits-long-enough-for-hs256-algorithm
  access-expiration: 3600000     # 1시간
  refresh-expiration: 604800000  # 7일

# 서버 설정
server:
  port: 0  # 랜덤 포트

# 로깅 설정
logging:
  level:
    com.example: DEBUG
    org.springframework.security: INFO
    org.springframework.web: DEBUG

# AI 서버 설정 (테스트용 Mock)
ai:
  fastapi:
    url: http://localhost:8001

# OAuth2 설정 (테스트용)
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test_kakao_client_id
            client-secret: test_kakao_client_secret
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/api/auth/kakao/callback
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id